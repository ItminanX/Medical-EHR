<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Patient Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            margin: 10px 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 102, 204, 0.15), rgba(0, 200, 150, 0.1));
            border: 1px solid rgba(0, 150, 200, 0.2);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #0066cc, #00c896);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.4);
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-menu {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 12px 20px;
            margin: 8px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            border-radius: 8px;
            display: block;
            text-decoration: none;
            color: #b0b8d4;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(0, 102, 204, 0.2);
            color: #fff;
            padding-left: 28px;
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 102, 204, 0.3), transparent);
            color: #0099ff;
            border-left: 3px solid #0099ff;
            padding-left: 25px;
        }

        .logout-btn {
            margin: 20px 15px 10px;
            padding: 12px 20px;
            background: transparent;
            border: 2px solid rgba(255, 59, 48, 0.5);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 59, 48, 0.1);
            border-color: #ff3b30;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            height: 80px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .header-title {
            font-size: 22px;
            font-weight: 600;
            color: #e0e7ff;
        }

        .content-container {
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Profile Cards */
        .profile-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .profile-card h2 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-field label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-field .value {
            font-size: 18px;
            color: #e0e7ff;
            font-weight: 500;
            padding: 12px 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 102, 204, 0.2);
            border-top-color: #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .nav-menu {
                display: flex;
                overflow-x: auto;
                padding: 10px 0;
            }

            .nav-item {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .header {
                padding: 15px 20px;
                height: auto;
            }

            .content-container {
                padding: 20px;
            }

            .profile-card {
                padding: 24px 20px;
            }

            .profile-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="user-profile">
            <div class="user-avatar">👤</div>
            <div class="user-name" id="sidebarName">Loading...</div>
        </div>
        
        <nav class="nav-menu">
            <a class="nav-item" href="my-health.html">My Health</a>
            <a class="nav-item active" href="profile.html">My Profile</a>
            <a class="nav-item" href="appointment.html">Appointment Booking</a>
            <a class="nav-item" href="tests-reports.html">Tests & Reports</a>
            <a class="nav-item" href="health-packages.html">Health Packages</a>
            <a class="nav-item" href="vaccination.html">Vaccination</a>
            <a class="nav-item" href="doctors.html">Our Doctors</a>
            <a class="nav-item" href="telemedicine.html">Telemedicine</a>
            <a class="nav-item" href="premium.html">Premium Program</a>
        </nav>

        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <h2 class="header-title">My Profile</h2>
        </header>

        <div class="content-container">
            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading your profile...</p>
            </div>

            <!-- Profile Content -->
            <div id="profileContent" style="display: none;">
                <!-- Personal Information -->
                <div class="profile-card">
                    <h2>Personal Information</h2>
                    <div class="profile-grid">
                        <div class="profile-field">
                            <label>Full Name</label>
                            <div class="value" id="displayName">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Phone Number</label>
                            <div class="value" id="displayPhone">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Age</label>
                            <div class="value" id="displayAge">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Gender</label>
                            <div class="value" id="displayGender">-</div>
                        </div>
                    </div>
                </div>

                <!-- Account Information -->
                <div class="profile-card">
                    <h2>Account Information</h2>
                    <div class="profile-grid">
                        <div class="profile-field">
                            <label>User ID</label>
                            <div class="value" id="displayUserId">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Member Since</label>
                            <div class="value" id="displayJoined">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Last Updated</label>
                            <div class="value" id="displayUpdated">-</div>
                        </div>
                        <div class="profile-field">
                            <label>Account Status</label>
                            <div class="value" style="color: #00c896;">✓ Active</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from '../js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        // Check auth and load profile
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            try {
                // Fetch user profile from Firestore
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    displayProfile(userData);
                } else {
                    console.error('User profile not found');
                    alert('Profile not found. Please complete your profile.');
                    window.location.href = '../index.html';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                alert('Failed to load profile. Please try again.');
            }
        });

        function displayProfile(userData) {
            // Update sidebar
            document.getElementById('sidebarName').textContent = userData.name;

            // Update profile fields
            document.getElementById('displayName').textContent = userData.name;
            document.getElementById('displayPhone').textContent = userData.phone;
            document.getElementById('displayAge').textContent = userData.age + ' years';
            document.getElementById('displayGender').textContent = 
                userData.gender.charAt(0).toUpperCase() + userData.gender.slice(1).replace('-', ' ');
            
            document.getElementById('displayUserId').textContent = userData.userId.substring(0, 12) + '...';
            
            // Format dates
            const joinedDate = new Date(userData.createdAt);
            document.getElementById('displayJoined').textContent = joinedDate.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            if (userData.updatedAt) {
                const updatedDate = new Date(userData.updatedAt);
                document.getElementById('displayUpdated').textContent = updatedDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } else {
                document.getElementById('displayUpdated').textContent = 'Never';
            }

            // Hide loading, show content
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('profileContent').style.display = 'block';
        }

        // Logout function
        window.handleLogout = async function() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await signOut(auth);
                    window.location.href = '../index.html';
                } catch (error) {
                    console.error('Logout error:', error);
                    alert('Failed to logout. Please try again.');
                }
            }
        };
    </script>
</body>
</html>
