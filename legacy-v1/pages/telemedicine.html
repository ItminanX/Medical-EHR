<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemedicine - Connect Instantly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 38px;
            color: #1a1a2e;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .benefits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }

        .benefit {
            background: #f8f9ff;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .benefit-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .benefit-text {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .cta-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .footer-text {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 15px;
            }

            .benefits {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💻</div>
        
        <h1>Healthcare at Your Fingertips</h1>
        <p class="subtitle">Connect with a doctor in minutes</p>
        
        <p class="description">
            Skip the waiting room. Get expert medical advice from the comfort of your home, whenever you need it.
        </p>

        <div class="benefits">
            <div class="benefit">
                <div class="benefit-icon">⏱️</div>
                <div class="benefit-text">Book instantly</div>
            </div>
            <div class="benefit">
                <div class="benefit-icon">👨‍⚕️</div>
                <div class="benefit-text">Licensed doctors</div>
            </div>
            <div class="benefit">
                <div class="benefit-icon">🔒</div>
                <div class="benefit-text">HIPAA secure</div>
            </div>
            <div class="benefit">
                <div class="benefit-icon">📱</div>
                <div class="benefit-text">Any device</div>
            </div>
        </div>

        <button class="cta-button" onclick="handleBooking()">Start Your Session</button>
        
        <p class="footer-text">Average wait time: 10 minutes • Available 24/7</p>
    </div>

    <script>
        function handleBooking() {
            alert('Redirecting to booking system...');
            // Replace with actual booking URL
            // window.location.href = 'https://your-booking-system.com';
        }
    </script>
</body>
</html>
